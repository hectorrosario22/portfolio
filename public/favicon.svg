<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Dark background -->
  <rect width="32" height="32" fill="#09090b"/>

  <!-- Corner accent marks (top-left, bottom-right) -->
  <path d="M 2 2 L 2 6 L 6 6" stroke="#3b82f6" stroke-width="1.2" fill="none" opacity="0.7"/>
  <path d="M 30 30 L 30 26 L 26 26" stroke="#3b82f6" stroke-width="1.2" fill="none" opacity="0.7"/>

  <!-- Thin border -->
  <rect x="1" y="1" width="30" height="30" fill="none" stroke="#1f2937" stroke-width="0.8"/>

  <!-- "HR" text — monospace style -->
  <!-- H: left vertical, crossbar, right vertical -->
  <rect x="5" y="9" width="2.5" height="14" fill="#ffffff"/>
  <rect x="5" y="15" width="8" height="2.5" fill="#ffffff"/>
  <rect x="10.5" y="9" width="2.5" height="14" fill="#ffffff"/>

  <!-- R: vertical, top curve, leg -->
  <rect x="16" y="9" width="2.5" height="14" fill="#ffffff"/>
  <!-- top arc of R (simplified as rects) -->
  <rect x="18.5" y="9" width="5" height="2.5" fill="#ffffff"/>
  <rect x="23.5" y="11.5" width="2.5" height="3" fill="#ffffff"/>
  <rect x="18.5" y="14.5" width="5" height="2.5" fill="#ffffff"/>
  <!-- leg diagonal of R -->
  <rect x="21" y="17" width="2.5" height="2.5" fill="#3b82f6"/>
  <rect x="23.5" y="19.5" width="2.5" height="3.5" fill="#3b82f6"/>

  <!-- Blue cursor underscore accent -->
  <rect x="5" y="25.5" width="22" height="2" fill="#3b82f6" opacity="0.8"/>
</svg>