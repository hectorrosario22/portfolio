<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&amp;family=Space+Grotesk:wght@700&amp;display=swap');
    </style>
    <!-- Grid pattern -->
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#ffffff" stroke-width="0.3" opacity="0.06"/>
    </pattern>
    <!-- Noise filter -->
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="multiply" result="blend"/>
      <feComposite in="blend" in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#09090b"/>

  <!-- Grid overlay -->
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Noise texture overlay -->
  <rect width="1200" height="630" fill="#09090b" opacity="0.04" filter="url(#noise)"/>

  <!-- Right side: Architecture diagram (decorative) -->
  <!-- Nodes -->
  <g opacity="0.12" stroke="#3b82f6" stroke-width="1" fill="none">
    <!-- Boxes -->
    <rect x="720" y="80" width="120" height="50" rx="0"/>
    <rect x="880" y="60" width="120" height="50" rx="0"/>
    <rect x="1020" y="100" width="120" height="50" rx="0"/>
    <rect x="800" y="180" width="120" height="50" rx="0"/>
    <rect x="960" y="200" width="120" height="50" rx="0"/>
    <rect x="700" y="290" width="120" height="50" rx="0"/>
    <rect x="870" y="310" width="120" height="50" rx="0"/>
    <rect x="1040" y="280" width="110" height="50" rx="0"/>
    <rect x="760" y="410" width="120" height="50" rx="0"/>
    <rect x="940" y="430" width="120" height="50" rx="0"/>
    <!-- Connectors -->
    <line x1="840" y1="105" x2="880" y2="85"/>
    <line x1="1000" y1="85" x2="1020" y2="120"/>
    <line x1="860" y1="130" x2="860" y2="180"/>
    <line x1="920" y1="205" x2="960" y2="225"/>
    <line x1="820" y1="230" x2="820" y2="290"/>
    <line x1="990" y1="250" x2="990" y2="310"/>
    <line x1="820" y1="340" x2="870" y2="335"/>
    <line x1="990" y1="335" x2="1040" y2="305"/>
    <line x1="880" y1="360" x2="880" y2="410"/>
    <line x1="1000" y1="330" x2="1000" y2="430"/>
    <!-- Labels inside boxes -->
  </g>

  <!-- Box labels -->
  <g font-family="'Fira Code', monospace" font-size="11" fill="#3b82f6" opacity="0.25">
    <text x="735" y="111">API_GATEWAY</text>
    <text x="892" y="91">AUTH_SVC</text>
    <text x="1030" y="131">RATE_LIMIT</text>
    <text x="812" y="211">MSG_BROKER</text>
    <text x="968" y="231">QUEUE_SVC</text>
    <text x="710" y="321">DB_CLUSTER</text>
    <text x="879" y="341">CACHE_SVC</text>
    <text x="1048" y="311">MONITOR</text>
    <text x="772" y="441">STORAGE</text>
    <text x="952" y="461">ANALYTICS</text>
  </g>

  <!-- Left accent bar -->
  <rect x="60" y="60" width="3" height="510" fill="#3b82f6" opacity="0.6"/>

  <!-- Terminal prompt label -->
  <text x="84" y="120" font-family="'Fira Code', monospace" font-size="14" fill="#3b82f6" font-weight="500">~/HR &gt; ./portfolio.sh</text>

  <!-- Main name -->
  <text x="84" y="240" font-family="'Space Grotesk', sans-serif" font-size="88" fill="#ffffff" font-weight="700" letter-spacing="-3" text-anchor="start">HECTOR</text>
  <text x="84" y="335" font-family="'Space Grotesk', sans-serif" font-size="88" fill="#ffffff" font-weight="700" letter-spacing="-3" text-anchor="start">ROSARIO</text>

  <!-- Separator line -->
  <line x1="84" y1="360" x2="660" y2="360" stroke="#3b82f6" stroke-width="1.5" opacity="0.4"/>

  <!-- Role subtitle -->
  <text x="84" y="395" font-family="'Fira Code', monospace" font-size="18" fill="#6b7280" letter-spacing="4">BACKEND DEVELOPER</text>

  <!-- Tech tags -->
  <g font-family="'Fira Code', monospace" font-size="12" fill="none">
    <!-- .NET -->
    <rect x="84" y="430" width="65" height="28" stroke="#374151" stroke-width="1"/>
    <text x="95" y="449" fill="#9ca3af">.NET</text>
    <!-- Azure -->
    <rect x="159" y="430" width="70" height="28" stroke="#374151" stroke-width="1"/>
    <text x="168" y="449" fill="#9ca3af">Azure</text>
    <!-- Docker -->
    <rect x="239" y="430" width="78" height="28" stroke="#374151" stroke-width="1"/>
    <text x="248" y="449" fill="#9ca3af">Docker</text>
    <!-- K8s -->
    <rect x="327" y="430" width="105" height="28" stroke="#374151" stroke-width="1"/>
    <text x="335" y="449" fill="#9ca3af">Kubernetes</text>
    <!-- AWS -->
    <rect x="442" y="430" width="55" height="28" stroke="#374151" stroke-width="1"/>
    <text x="452" y="449" fill="#9ca3af">AWS</text>
    <!-- gRPC -->
    <rect x="507" y="430" width="60" height="28" stroke="#374151" stroke-width="1"/>
    <text x="516" y="449" fill="#9ca3af">gRPC</text>
  </g>

  <!-- Status indicator -->
  <circle cx="84" cy="560" r="5" fill="#3b82f6">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="98" y="565" font-family="'Fira Code', monospace" font-size="13" fill="#4b5563">SYS_ONLINE // Available for opportunities</text>

  <!-- Bottom right: domain -->
  <text x="1140" y="600" font-family="'Fira Code', monospace" font-size="13" fill="#374151" text-anchor="end">hectorrosario.dev</text>

  <!-- Corner decorations -->
  <!-- Top left -->
  <path d="M 40 40 L 40 60 L 60 60" stroke="#3b82f6" stroke-width="1.5" fill="none" opacity="0.4"/>
  <!-- Top right -->
  <path d="M 1160 40 L 1160 60 L 1140 60" stroke="#3b82f6" stroke-width="1.5" fill="none" opacity="0.4"/>
  <!-- Bottom left -->
  <path d="M 40 590 L 40 570 L 60 570" stroke="#3b82f6" stroke-width="1.5" fill="none" opacity="0.4"/>
  <!-- Bottom right -->
  <path d="M 1160 590 L 1160 570 L 1140 570" stroke="#3b82f6" stroke-width="1.5" fill="none" opacity="0.4"/>
</svg>
